name: Release

# Pushing a v* tag builds and publishes a whole release, nothing by hand:
#   0. tests (tests.yml): nothing is built if any fail.
#   1. bundle (Linux): generates the ambient sounds, builds the
#      pawmodoro-v<VERSION>-windows.zip the in-app updater downloads
#      (tools/build_bundle.py), and creates the GitHub release with notes
#      taken from the README's "What changed" entry (tools/release_notes.py).
#   2. installer (Windows): compiles Pawmodoro-Setup.exe with Inno Setup
#      (windows_installer/pawmodoro.iss; windows-latest ships it) and
#      attaches it to that release. Unlike the zip, it's for winget and
#      similar package managers that need a real silent installer.
# Run it from the Actions tab instead to just build both as downloadable
# artifacts, without releasing anything.

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  bundle:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches version.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "from version import VERSION; print(VERSION)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version.py ($version)"
            exit 1
          fi

      # The ambient sound files are gitignored (too big for git) and
      # generated from fixed seeds, so they come out the same every time.
      - name: Generate ambient sound resources
        run: |
          pip install numpy scipy
          python tools/generate_rain.py
          python tools/generate_ambient.py

      - name: Build the update bundle
        run: python tools/build_bundle.py --out dist

      - name: Write release notes
        run: python tools/release_notes.py > dist/notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: pawmodoro-bundle
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*-windows.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*-windows.zip \
              --title "Pawmodoro $GITHUB_REF_NAME" --notes-file dist/notes.md --latest
          fi

  installer:
    needs: bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate ambient sound resources
        run: |
          pip install numpy scipy
          python tools/generate_rain.py
          python tools/generate_ambient.py

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content version.py -Raw
          if ($text -notmatch '"([^"]+)"') { throw "Couldn't parse VERSION from version.py" }
          echo "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} windows_installer\pawmodoro.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Pawmodoro-Setup
          path: windows_installer\Output\Pawmodoro-Setup.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" windows_installer\Output\Pawmodoro-Setup.exe --clobber
