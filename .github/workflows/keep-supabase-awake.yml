name: Keep Supabase project awake

# Supabase's free tier auto-pauses a project after about a week with no
# API/database activity, which is what silently broke the mobile app (and
# would've broken desktop sync too) on every device at once, since they
# all talk to the one project. A cheap GET every couple of days counts as
# activity and keeps that from happening again.
#
# Pings GoTrue's health-check endpoint (/auth/v1/health) rather than
# PostgREST's schema root -- PostgREST's root always 401s for a
# non-service_role key ("Only the service_role API key can be used for
# this endpoint"), a real response but not the "it's working" signal it
# looked like. Every route still goes through Supabase's gateway (Kong),
# which requires an apikey header regardless of which route it is, so
# the anon key is still needed here.
#
# Requires two repo secrets, the same Project URL + anon public key used
# to set up the desktop app / phone (Settings -> Secrets and variables ->
# Actions):
#   SUPABASE_URL        e.g. https://xxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY    the "anon public" key from Project Settings -> API

on:
  schedule:
    - cron: "0 12 */2 * *"  # every 2 days at 12:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase auth health endpoint
        run: |
          url="${{ secrets.SUPABASE_URL }}"
          url="${url%/}"  # strip a trailing slash, in case the secret has one
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "$url/auth/v1/health")
          echo "HTTP $code"
          cat /tmp/resp.txt
          if [ "$code" != "200" ]; then
            echo "Expected HTTP 200 from $url/auth/v1/health"
            exit 1
          fi
