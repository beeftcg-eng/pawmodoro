name: Deploy push function

# Keeps the deployed send-reminders Edge Function (phone push
# notifications) in step with supabase/functions/: deploys whenever it
# changes on main, on every release tag, or by hand from the Actions tab.
# Needs the repo secret SUPABASE_ACCESS_TOKEN (a Supabase personal access
# token, supabase.com/dashboard/account/tokens); without it the job only
# warns. The project is the one in cloud_defaults.py.

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy send-reminders
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN isn't set, so the push function wasn't deployed"
            exit 0
          fi
          ref=$(python3 -c "import cloud_defaults, re; print(re.match(r'https://([a-z0-9]+)\.supabase\.co', cloud_defaults.DEFAULT_URL).group(1))")
          supabase functions deploy send-reminders --project-ref "$ref" --use-api
