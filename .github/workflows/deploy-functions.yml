name: Deploy cloud

# Keeps the shared Supabase project in step with supabase/: whenever it
# changes on main, on every release tag, or by hand from the Actions tab, in
# the order a schema change needs (CLAUDE.md): the send-reminders Edge
# Function (phone push notifications) first, then schema.sql, then
# push_reminders.sql. schema.sql only goes out after its tests pass.
#
# Repo secrets (a step fails when its secret is missing, so a green run means
# the cloud really was updated):
#   SUPABASE_ACCESS_TOKEN  a Supabase personal access token
#                          (supabase.com/dashboard/account/tokens), for the function
#   SUPABASE_DB_URL        the database's connection string (Project Settings →
#                          Database → Connection string → Session pooler, with
#                          the database password filled in), for the SQL
# The project is the one in cloud_defaults.py.

on:
  push:
    branches: [main]
    paths: ["supabase/**"]
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  function:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy send-reminders
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN isn't set, so the push function wasn't deployed. Add it under Settings → Secrets and variables → Actions"
            exit 1
          fi
          ref=$(python3 -c "import cloud_defaults, re; print(re.match(r'https://([a-z0-9]+)\.supabase\.co', cloud_defaults.DEFAULT_URL).group(1))")
          supabase functions deploy send-reminders --project-ref "$ref" --use-api

  schema:
    needs: function
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Test the schema first
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: tests/sql/run.sh

      - name: Apply schema.sql, then push_reminders.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL isn't set, so schema.sql wasn't applied. Add it under Settings → Secrets and variables → Actions"
            exit 1
          fi
          # one transaction: a failure part-way leaves the cloud as it was
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q --single-transaction -f supabase/schema.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/push_reminders.sql
          echo "cloud schema is now version $(psql "$SUPABASE_DB_URL" -At -c 'select public.schema_version()')"
